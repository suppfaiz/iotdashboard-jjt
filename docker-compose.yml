services:
  # Laravel Application Stack (Web, Reverb, Workers)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot_dashboard_app
    restart: always
    ports:
      - "80:80"
      - "8081:8081"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    volumes:
      - app-storage:/var/www/storage
    depends_on:
      - db
      - mqtt
    networks:
      - iot-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: iot_dashboard_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dashboard_iot_baru}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - iot-network

  # Mosquitto MQTT Broker
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: iot_dashboard_mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./.docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  app-storage:
    driver: local
  mqtt-data:
    driver: local
  mqtt-log:
    driver: local
