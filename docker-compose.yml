services:
  # Laravel Application Stack (Web, Reverb, Workers)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot_dashboard_app
    restart: always
    ports:
      - "80:80"
      - "8085:8085"
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    volumes:
      - app-storage:/var/www/storage
      - ./.env:/var/www/.env
      - ./database:/var/www/database
    depends_on:
      - mqtt
      - mysql
    networks:
      - iot-network

  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: iot_dashboard_mysql
    restart: always
    environment:
      - MYSQL_DATABASE=dashboard_iot_baru
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - iot-network

  # Mosquitto MQTT Broker
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: iot_dashboard_mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./.docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./.docker/passwd:/mosquitto/config/passwd
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    networks:
      - iot-network

  # Web-based Database Manager (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: iot_dashboard_phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  app-storage:
    driver: local
  mqtt-data:
    driver: local
  mqtt-log:
    driver: local
  mysql-data:
    driver: local
