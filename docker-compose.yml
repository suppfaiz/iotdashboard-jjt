services:
  # Laravel Application Stack (Web, Reverb, Workers)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: iot_dashboard_app
    restart: always
    ports:
      - "80:80"
      - "8081:8081"
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    volumes:
      - app-storage:/var/www/storage
      - ./.env:/var/www/.env
      - ./database:/var/www/database
    depends_on:
      - mqtt
    networks:
      - iot-network

  # Mosquitto MQTT Broker
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: iot_dashboard_mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./.docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    networks:
      - iot-network

  # Web-based Database Manager (Adminer)
  adminer:
    image: adminer:latest
    container_name: iot_dashboard_adminer
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - ./database:/var/www/html/database
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  app-storage:
    driver: local
  mqtt-data:
    driver: local
  mqtt-log:
    driver: local
